<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" width="1190" height="1684" font-family="Inter, 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif"><rect x="0" y="0" width="1190" height="1684" fill="#ffffff"/><rect x="0" y="0" width="1190" height="8" fill="#004030"/><text x="44" y="46" font-size="13" font-weight="700" letter-spacing="1" fill="#92400E">Co-opetitive Dynamics &amp; Platform Strategy Analysis: W9 Proposal Summary</text><text x="44" y="100" font-size="26" font-weight="700" font-style="normal" font-family="Merriweather, 'Noto Serif TC', 'Noto Sans TC', 'Microsoft JhengHei', serif" fill="#004030">Co-opetitive Dynamics &amp; Platform Strategy Analysis</text><text x="44" y="124" font-size="13.5" font-weight="400" font-style="normal" fill="#64748b">CDPS-EMI 1151 · Group 4 · Members: __ · Date: 2026-11-08 · ETtoday 東森新聞雲</text><line x1="44" y1="140" x2="1146" y2="140" stroke="#D8C3A5" stroke-width="2"/><g transform="translate(44,164)"><rect x="0" y="0" width="540" height="285" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">1</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Background</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">W16: Problem Definition 20%</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">ETtoday 東森新聞雲 leads Taiwan’s online news brands (38% weekly</text><text x="44" y="110" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">use, 46% trust) yet lost money for four years and turned</text><text x="44" y="131.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">profitable only in Jul 2025 after cutting staff from 561 to 385</text><text x="44" y="153" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">with AI</text><text x="44" y="179.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">LINE (49%), YouTube (48%) and Facebook (47%) are now the main</text><text x="44" y="201" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">news gateways; international platforms take most digital ad growth</text><text x="44" y="227.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Question: does ETtoday’s platform strategy explain the</text><text x="44" y="249" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">turnaround, and is it sustainable? Scope: Taiwan, 2025–2026</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="175" r="2.6" fill="#004030"/><circle cx="32" cy="223" r="2.6" fill="#004030"/></g><g transform="translate(606,164)"><rect x="0" y="0" width="540" height="285" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">2</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Chosen Firm / Platform</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">Track, industry, firms or platforms, scope</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Track 2: Platform Strategy</text><text x="44" y="115" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Industry: online news platforms</text><text x="44" y="141.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Focal platform: ETtoday 東森新聞雲 (web + app)</text><text x="44" y="168" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Rivals: TVBS, 東森新聞網, 三立, UDN, LTN, NOWnews; gateways:</text><text x="44" y="189.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">LINE TODAY, Google, Meta, YouTube</text><text x="44" y="216" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Event: 2025 loss-to-profit turnaround; 媒體議價法 stalled (Aug</text><text x="44" y="237.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">2025)</text><text x="44" y="264" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Scope: Taiwan, Jan 2025 to Dec 2026</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="110.5" r="2.6" fill="#004030"/><circle cx="32" cy="137" r="2.6" fill="#004030"/><circle cx="32" cy="163.5" r="2.6" fill="#004030"/><circle cx="32" cy="211.5" r="2.6" fill="#004030"/><circle cx="32" cy="259.5" r="2.6" fill="#004030"/></g><g transform="translate(44,471)"><rect x="0" y="0" width="540" height="356" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">3</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Data Sources</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">W16: Data Quality 20%</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Mode: automatic (Work / Task Agent)</text><text x="44" y="115" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">MOPS: 東森國際 (2614), 遊戲橘子 (6180); MOEA registry;</text><text x="44" y="136.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">data.gov.tw NCC datasets; 立法院 open data; FTC white paper; 數發</text><text x="44" y="158" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">部 reports; Reuters DNR 2017–2026, TWNIC 2025, DMA reports;</text><text x="44" y="179.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">News corpus 2025 on (Work / Task Agent), Google Trends, YouTube</text><text x="44" y="201" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">API, sitemaps</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="110.5" r="2.6" fill="#004030"/></g><g transform="translate(606,471)"><rect x="0" y="0" width="540" height="356" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">4</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Tech Architecture</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">AI platform &amp; agents, data workflow, deployment | W16: Analysis &amp; AI Utilization 25%</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Claude (Opus 5.5 / Fable 5.1, one paid plan) in a Claude Project</text><text x="44" y="110" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">with KB.md as the Work/Task Agent; Claude Code as the Coding</text><text x="44" y="131.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Agent; Google Sheets (staging → verified); Vue + Vite SPA on</text><text x="44" y="153" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">GitHub Pages via GitHub Actions; HyperFrames, Fish.Audio, ffmpeg</text><text x="44" y="174.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">for the video</text><text x="44" y="201" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Agent: collect news (2025 on) and documents; tag by a fixed</text><text x="44" y="222.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">codebook; extract KPIs from DNR, TWNIC, DMA, MOPS; pull</text><text x="44" y="244" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">YouTube, sitemap and app-review data; compute counts, lags,</text><text x="44" y="265.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">trends; draft PARTS, AMC and bilingual text for members</text><text x="44" y="292" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Guardrails: checked_by on every row, source URL on every figure,</text><text x="44" y="313.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">dated version line for every KB.md change. Weekly update run</text><text x="44" y="335" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">(scheduled vs manual TBD after W11); static repo, no keys</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="196.5" r="2.6" fill="#004030"/><circle cx="32" cy="287.5" r="2.6" fill="#004030"/></g><g transform="translate(44,849)"><rect x="0" y="0" width="540" height="275" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">5</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Expected Deployed Output</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">W16: Delivery 15% (page + video)</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">URL: https://__.github.io/__/ (TBD); live the weekend before W16</text><text x="44" y="115" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Bilingual Vue SPA: Value Net game board, Chen competitor map,</text><text x="44" y="136.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">brushable action–response timeline, 8-chart platform dashboard,</text><text x="44" y="158" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">rules panel with a revenue-sharing slider</text><text x="44" y="184.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Insight cards AQ1–AQ6 ending in PARTS-checklist</text><text x="44" y="206" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">recommendations; 2-minute bilingual video embedded from YouTube;</text><text x="44" y="227.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">footer with AI-use disclosure and sources</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="110.5" r="2.6" fill="#004030"/><circle cx="32" cy="180" r="2.6" fill="#004030"/></g><g transform="translate(606,849)"><rect x="0" y="0" width="540" height="275" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">6</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Team Roles &amp; Collaboration</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">Add member names and how you work together (suggested: three pairs)</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Data (__, __): sources and records, data sheet, verification,</text><text x="44" y="110" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">dynamics, citations</text><text x="44" y="136.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Strategy Analysis (__, __): TP0, financials, KB.md, PARTS and</text><text x="44" y="158" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Value Net, metrics, insight, disclosure</text><text x="44" y="184.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Web &amp; Video (__): AI platform, bilingual SPA, 2-min video, GitHub</text><text x="44" y="206" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Pages</text><text x="44" y="232.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">How we work: one shared Google Sheet (staging → verified); source</text><text x="44" y="254" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">URL and checked_by on every row; dated KB.md versions</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="132" r="2.6" fill="#004030"/><circle cx="32" cy="180" r="2.6" fill="#004030"/><circle cx="32" cy="228" r="2.6" fill="#004030"/></g><g transform="translate(44,1146)"><rect x="0" y="0" width="540" height="221" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">7</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Milestones</text><text x="44" y="72.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">W5 TP0: track, topic, scope and first source list</text><text x="44" y="99" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">W9 TP Proposal (8 Nov): GX_TP_Proposal.md + a 10-minute bilingual</text><text x="44" y="120.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">pitch in W10</text><text x="44" y="147" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">W12 TP-Data: verified data sheet, analysis tables and charts</text><text x="44" y="173.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">W14 TP-Web: first draft of the bilingual SPA</text><text x="44" y="200" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">W15 TP Final: SPA + video; W16: web contest, peer review, awards</text><circle cx="32" cy="68" r="2.6" fill="#004030"/><circle cx="32" cy="94.5" r="2.6" fill="#004030"/><circle cx="32" cy="142.5" r="2.6" fill="#004030"/><circle cx="32" cy="169" r="2.6" fill="#004030"/><circle cx="32" cy="195.5" r="2.6" fill="#004030"/></g><g transform="translate(606,1146)"><rect x="0" y="0" width="540" height="221" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="540" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">8</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">W16 Grading Map</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">Where this page answers each criterion</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Problem Definition 20% → ① Background, ⑨ Analysis Questions</text><text x="44" y="115" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Data Quality 20% → ③ Data Sources (mismatch rate, source checks)</text><text x="44" y="141.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Analysis &amp; AI Utilization 25% → ④ Tech Architecture, Diagram A ⑥</text><text x="44" y="168" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Business Insight 20% → ⑨ Analysis Questions and Diagram A ⑦</text><text x="44" y="194.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">Delivery 15% → ⑤ Expected Deployed Output (page + video)</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="110.5" r="2.6" fill="#004030"/><circle cx="32" cy="137" r="2.6" fill="#004030"/><circle cx="32" cy="163.5" r="2.6" fill="#004030"/><circle cx="32" cy="190" r="2.6" fill="#004030"/></g><g transform="translate(44,1389)"><rect x="0" y="0" width="1102" height="242" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="0" y="0" width="1102" height="5" rx="2" fill="#004030"/><circle cx="30" cy="34" r="14" fill="#004030"/><text x="30" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#D8C3A5">9</text><text x="54" y="41" font-size="17.5" font-weight="700" font-style="normal" fill="#0f172a">Analysis Questions</text><text x="54" y="57" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b">PARTS × AMC × Platform Strategy | W16: Business Insight 20%</text><text x="44" y="88.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">AQ1: Who are the players in ETtoday’s Value Net, and where does its added value come from now that direct and app traffic lead?</text><text x="44" y="115" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">AQ2: Are LINE TODAY, Google, Meta and YouTube complementors or competitors to ETtoday, and how has that shifted since 2025?</text><text x="44" y="141.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">AQ3: How fast does ETtoday answer rivals’ moves, who moves first, and do market commonality and resource similarity predict it?</text><text x="44" y="168" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">AQ4: How much of the 2025 turnaround was cost (AI restructuring) vs revenue (ads, OOH, commerce), and which side gained or lost?</text><text x="44" y="194.5" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">AQ5: How would the 媒體議價法, the 數發部 revenue-sharing platform and Google’s NT$300 M fund change ETtoday’s rules of the game?</text><text x="44" y="221" font-size="14.5" font-weight="400" font-style="normal" fill="#1f2937">AQ6: Do network effects tip Taiwan online news to one winner or fragment it, and where should ETtoday bet next?</text><circle cx="32" cy="84" r="2.6" fill="#004030"/><circle cx="32" cy="110.5" r="2.6" fill="#004030"/><circle cx="32" cy="137" r="2.6" fill="#004030"/><circle cx="32" cy="163.5" r="2.6" fill="#004030"/><circle cx="32" cy="190" r="2.6" fill="#004030"/><circle cx="32" cy="216.5" r="2.6" fill="#004030"/></g><text x="1166" y="1668" text-anchor="end" font-size="9.5" fill="#94a3b8">Proposal Diagram Studio · Prof. Shihmin Lo, NCNU IBS</text></svg>